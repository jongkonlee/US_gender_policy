name: collect raw data (women candidates tracker, temporary)

on:
  push:
    branches: [wc-collect]
    paths: ["pipeline/**", "collect_args.txt", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: wc-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: |
          ARGS="$(cat collect_args.txt 2>/dev/null || true)"
          python pipeline/collect.py $ARGS 2>&1 | tee collect_log.txt
          mkdir -p raw && cp collect_log.txt raw/collect_log_$(date -u +%Y%m%dT%H%M%S).txt
      - name: commit raw data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw
          if ! git diff --cached --quiet; then
            git commit -q -m "raw data $(date -u +%FT%TZ)"
            git push origin HEAD:wc-collect
          fi
