name: probe (data source check)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/probe.py
      - name: save report to the probe-results branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/probe && cp -r probe/* /tmp/probe/ 2>/dev/null || true
          git checkout --orphan probe-results
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/probe/* . 2>/dev/null || echo "no report" > NO_REPORT
          git add -A
          git commit -m "probe results $(date -u +%FT%TZ)"
          git push -f origin probe-results
